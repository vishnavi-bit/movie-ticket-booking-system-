<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Movie Ticket Booking - browse movies, pick seats and book tickets. A frontend demo project.">
  <title>Movie Ticket Booking · Movie Tickets</title>
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="loader" id="loader" aria-hidden="true"><div class="spinner"></div></div>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="#/" class="logo" aria-label="Movie Ticket Booking home">
        <img src="assets/icons/logo.svg" alt="" width="34" height="34">
        <span>Movie Ticket <b>Booking</b></span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="#/movies" data-nav="#/movies">Movies</a>
        <a href="#/movies?status=now" data-nav="#/movies?status=now">Now Showing</a>
        <a href="#/movies?status=upcoming" data-nav="#/movies?status=upcoming">Upcoming</a>
        <a href="#/bookings" data-nav="#/bookings">My Bookings</a>
        <a href="#/wishlist" data-nav="#/wishlist">Wishlist</a>
        <a href="#/admin" data-nav="#/admin" class="admin-only" hidden>Admin</a>
      </nav>

      <div class="header-tools">
        <button type="button" class="city-btn" data-action="city" title="Change city">
          <span aria-hidden="true">📍</span><span id="cityName">Hyderabad</span>
        </button>
        <form class="header-search" id="headerSearch" role="search">
          <input id="headerSearchInput" type="search" placeholder="Search movies" aria-label="Search movies">
        </form>
        <button type="button" class="icon-btn" id="themeBtn" data-action="theme" aria-label="Toggle dark or light theme">☀</button>
        <div class="notif-wrap">
          <button type="button" class="icon-btn" data-action="notif" aria-label="Notifications">
            🔔<span class="badge" id="notifBadge" hidden>0</span>
          </button>
          <div class="dropdown notif-panel" id="notifPanel"></div>
        </div>
        <div id="authArea" class="auth-area"></div>
        <button type="button" class="icon-btn menu-toggle" data-action="menu" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <main id="app" class="app-main"></main>
  <footer class="site-footer" id="siteFooter"></footer>

  <button type="button" class="back-top" id="backTop" data-action="back-top" aria-label="Back to top">↑</button>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot"></div>
  <div class="processing" id="processing" hidden>
    <div class="spinner"></div>
    <p>Processing demo payment…</p>
  </div>

  <script src="js/app.js"></script>
  <script src="js/movies.js"></script>
  <script src="js/seats.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
